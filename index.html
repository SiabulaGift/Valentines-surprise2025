<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Always and Forever?</title>
</head>

<body style="margin:0; background:#0a0a0a; font-family: 'Georgia', serif; overflow:hidden;">

<!-- MAIN SCREEN -->
<div id="main" style="
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
color:#f5e6d3;
text-align:center;
background:radial-gradient(circle at center, rgba(255,140,0,0.15) 0%, #0a0a0a 60%);
transition:1s;
">

<h1 style="font-size:38px; letter-spacing:2px; margin-bottom:40px;">
Always and Forever?
</h1>

<div>
<button id="yesBtn" 
style="
padding:15px 35px;
font-size:20px;
border:none;
border-radius:30px;
margin:10px;
background:#ff4d6d;
color:white;
cursor:pointer;
transition:0.3s;">
Yes
</button>

<button id="noBtn" 
style="
padding:15px 35px;
font-size:20px;
border:none;
border-radius:30px;
margin:10px;
background:#444;
color:white;
cursor:pointer;
transition:0.3s;">
No
</button>
</div>

</div>

<!-- SECOND PAGE -->
<div id="page2" style="
display:none;
height:100vh;
justify-content:center;
align-items:center;
text-align:center;
padding:30px;
color:#f5e6d3;
background:radial-gradient(circle at center, rgba(255,140,0,0.2) 0%, #0a0a0a 70%);
">

<div style="max-width:600px;">
<h2 style="margin-bottom:30px;">My Love ❤️</h2>

<p style="font-size:18px; line-height:1.8;">
I love you, for you I was made for, I will walk this path called life until the green leaves of eternity fall off and to you I will give my love until the hour glass of time runs out, and above all! To us, to the love we share and future we envision.
</p>

</div>
</div>

<script>

let yes = document.getElementById("yesBtn");
let no = document.getElementById("noBtn");
let main = document.getElementById("main");
let page2 = document.getElementById("page2");

let yesSize = 20;
let noSize = 20;

no.addEventListener("click", function(){

    yesSize += 8;
    noSize -= 3;

    yes.style.fontSize = yesSize + "px";
    yes.style.padding = (15 + yesSize/2) + "px " + (35 + yesSize) + "px";

    if(noSize > 8){
        no.style.fontSize = noSize + "px";
    } else {
        no.style.display = "none";
    }

});

yes.addEventListener("click", function(){

    main.style.opacity = "0";

    setTimeout(function(){
        main.style.display = "none";
        page2.style.display = "flex";
    }, 800);

});

</script>

</body>
    </html>
