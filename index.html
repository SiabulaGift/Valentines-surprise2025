
<!DOCTYPE html>
<html>
<head>
  <title>always and forever</title>
</head>

<body style="
  margin:0;
  height:100vh;
  background:#050505;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Georgia, serif;
">

<div id="scene" style="
  position:relative;
  width:90%;
  max-width:700px;
  height:80%;
  opacity:0;
">

  <!-- Candle -->
  <div id="candle" style="
    position:absolute;
    bottom:80px;
    left:20%;
    width:12px;
    height:80px;
    background:#f0e6b6;
    border-radius:6px;
    box-shadow:0 0 15px rgba(255,200,100,0.3);
    opacity:0;
  ">
    <div id="flame" style="
      position:absolute;
      top:-28px;
      left:-8px;
      width:28px;
      height:28px;
      background: radial-gradient(circle at 50% 50%, #fff4c2 0%, #ffb347 60%, #ff5e00 100%);
      border-radius:50%;
      filter: blur(0.5px);
      opacity:0;
    "></div>
  </div>

  <!-- Candle Light Glow -->
  <div id="light" style="
    position:absolute;
    width:600px;
    height:600px;
    left:5%;
    bottom:0;
    background:radial-gradient(circle, rgba(255,200,120,0.25) 0%, rgba(0,0,0,0.9) 70%);
    pointer-events:none;
    opacity:0;
  "></div>

  <!-- Book -->
  <div id="book" style="
    position:absolute;
    bottom:60px;
    left:50%;
    transform:translateX(-50%) rotateY(-8deg) rotateX(6deg) scale(0.9);
    width:340px;
    height:440px;
    background:#f8f2dc;
    border-radius:18px;
    box-shadow:
      -15px 15px 40px rgba(0,0,0,0.7),
      inset -15px 0 25px rgba(0,0,0,0.15);
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:26px;
    color:#b08d2f;
    text-align:center;
    letter-spacing:2px;
    opacity:0;
    transition:all 2s ease;
  ">
    always and forever
  </div>

</div>

<script>
setTimeout(() => {

  const scene = document.getElementById("scene");
  scene.style.transition = "opacity 2s ease";
  scene.style.opacity = 1;

  const candle = document.getElementById("candle");
  const flame = document.getElementById("flame");
  const light = document.getElementById("light");
  const book = document.getElementById("book");

  candle.style.transition = "opacity 2s ease";
  candle.style.opacity = 1;

  flame.style.transition = "opacity 1.5s ease";
  flame.style.opacity = 1;

  light.style.transition = "opacity 2s ease";
  light.style.opacity = 1;

  setInterval(() => {
    const flicker = 0.95 + Math.random() * 0.1;
    flame.style.transform = `scale(${flicker}) translateY(${Math.random()*2-1}px)`;
  }, 180);

  setTimeout(() => {
    book.style.opacity = 1;
    book.style.transform = "translateX(-50%) rotateY(-8deg) rotateX(6deg) scale(1)";
  }, 800);

}, 1500);
</script>

</body>
</html>
