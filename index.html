<!DOCTYPE html>
<html>
<head>
  <title>Always and Forever 💖</title>
</head>

<body style="
  margin:0;
  height:100vh;
  background:black;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Georgia, serif;
">

<!-- Candle + Book Container -->
<div id="scene" style="
  position:relative;
  width:80%;
  max-width:600px;
  height:70%;
  display:flex;
  justify-content:center;
  align-items:flex-end;
  opacity:0;
">

  <!-- Book -->
  <div id="book" style="
    width:300px;
    height:400px;
    background:#fff8e1;
    border-radius:15px;
    box-shadow:0 10px 40px rgba(0,0,0,0.6);
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:24px;
    color:#b8860b;
    font-weight:bold;
    opacity:0;
    transform:scale(0.8);
    transition:all 2s ease;
    text-align:center;
  ">
    always and forever
  </div>

  <!-- Candle -->
  <div id="candle" style="
    position:absolute;
    bottom:20px;
    left:30%;
    width:10px;
    height:60px;
    background:#eee8aa;
    border-radius:5px;
    opacity:0;
  ">
    <div id="flame" style="
      position:absolute;
      top:-20px;
      left:-5px;
      width:20px;
      height:20px;
      background: radial-gradient(circle at 50% 50%, #ffeb99 0%, #ff9e3f 60%, #ff4500 100%);
      border-radius:50%;
      opacity:0;
      transform-origin:center bottom;
    "></div>
  </div>

</div>

<script>
  // Initial darkness pause
  setTimeout(() => {
    const scene = document.getElementById('scene');
    scene.style.transition = "opacity 2s ease";
    scene.style.opacity = 1;

    // Fade in candle
    const candle = document.getElementById('candle');
    candle.style.transition = "opacity 2s ease";
    candle.style.opacity = 1;

    // Fade in flame
    const flame = document.getElementById('flame');
    flame.style.transition = "opacity 1s ease";
    flame.style.opacity = 1;

    // Flame flicker
    setInterval(() => {
      const flicker = 0.9 + Math.random() * 0.2; // scale flicker
      flame.style.transform = `scale(${flicker}) translateY(${Math.random()*2-1}px)`;
    }, 200);

    // Reveal book gradually
    const book = document.getElementById('book');
    setTimeout(() => {
      book.style.opacity = 1;
      book.style.transform = "scale(1)";
    }, 800);

  }, 1500); // 1.5 sec darkness pause
</script>

</body>
</html>
